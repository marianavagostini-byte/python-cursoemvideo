<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de produtos</title>
    <link rel="stylesheet" href="catalogo.css">
</head>
<body>
    <header class="cabecalho">
        <h1>Tech Store</h1>
        <p>Catálogo de produtos</p>
    </header>

    <main>
        <section class="produtos" aria-label="Produtos disponíveis">
            <article class="produto">
                <h2>Teclado</h2>
                <p>Teclado para produtividade e estudo.</p>
                <strong>R$ 150,00</strong>
            </article>

            <article class="produto">
                <h2>Mouse</h2>
                <p>Mouse para trabalho e uso diário.</p>
                <strong>R$ 80,00</strong>
            </article>

            <article class="produto">
                <h2>Monitor</h2>
                <p>Monitor para ampliar sua área de trabalho.</p>
                <strong>R$ 900,00</strong>
            </article>
        </section>
    </main>
</body>
</html>
